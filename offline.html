<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>سليم — غير متصل بالإنترنت</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:#0F2744;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{max-width:400px}
.icon{font-size:72px;margin-bottom:24px}
h1{font-size:24px;font-weight:700;margin-bottom:12px}
p{font-size:14px;color:rgba(255,255,255,.6);line-height:1.8;margin-bottom:32px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:#1B6CA8;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans Arabic',sans-serif;transition:background .15s}
.btn:hover{background:#145289}
.status{margin-top:20px;font-size:12px;color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">📡</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>يبدو أن اتصالك بالإنترنت منقطع.<br/>تحقق من الاتصال وحاول مرة أخرى.</p>
  <button class="btn" onclick="tryReload()">
    🔄 إعادة المحاولة
  </button>
  <div class="status" id="status">جاري التحقق من الاتصال...</div>
</div>
<script>
function tryReload(){
  document.getElementById('status').textContent='جاري الاتصال...'
  fetch('/selim-system/login.html',{method:'HEAD'})
    .then(()=>location.href='/selim-system/login.html')
    .catch(()=>{document.getElementById('status').textContent='لا يزال غير متصل'})
}
window.addEventListener('online',()=>location.href='/selim-system/login.html')
setInterval(()=>{
  if(navigator.onLine)location.href='/selim-system/login.html'
},5000)
</script>
</body>
</html>
